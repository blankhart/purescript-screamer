package:
  name: screamer
  build:
    censorProjectWarnings:
      # Its foreign module is a JavaScript API for add-on FFI, which no
      # PureScript code imports.
      - byPrefix: "The following definitions in the foreign module for module Screamer.Runtime.Unsafe are unused"
  dependencies:
    - aff
    - arrays
    - control
    - datetime
    - effect
    - either
    - exceptions
    - filterable
    - foldable-traversable
    - maybe
    - now
    - nullable
    - numbers
    - prelude
    - record
    - refs
    - strings
    - tuples
    - typelevel-prelude
    - unsafe-coerce
    - web-clipboard
    - web-dom
    - web-events
    - web-html
    - web-pointerevents
    - web-touchevents
    - web-uievents
  test:
    main: Test.Main
    dependencies:
      - aff
      - arrays
      - datetime
      - effect
      - either
      - exceptions
      - foldable-traversable
      - identity
      - integers
      - maybe
      - newtype
      - quickcheck
      - refs
      - spec
      - strings
      - web-dom
      - web-events
      - web-uievents
workspace:
  packageSet:
    registry: 81.4.0
  extraPackages:
    windrose-router:
      git: https://github.com/blankhart/purescript-windrose-router.git
      ref: 6199237cf42d35b8ca3d89ceaba40efb83966ac3
