name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Cache PureScript packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/spago-nodejs
            .spago
          key: spago-${{ hashFiles('spago.lock') }}

      - name: Install
        run: npm ci

      - name: No sinuous imports
        run: |
          test -z "$(npm ls sinuous --parseable)"
          if grep -rnE "(from|import|require\()[[:space:]]*['\"]sinuous|Screamer\.Core\.Sinuous|Screamer\.Observable" \
              --include='*.ts' --include='*.js' --include='*.mjs' --include='*.purs' \
              src test examples codegen bench compile-fail; then
            echo "sinuous is imported above"; exit 1
          fi

      - name: Type-check TypeScript
        run: npx tsc

      - name: Compiled .js is committed and matches its .ts
        run: |
          if [ -n "$(git status --porcelain -- 'src/**/*.js')" ]; then
            echo "Run npx tsc and commit the .js files it changes:"
            git status --porcelain -- 'src/**/*.js'
            exit 1
          fi
          orphans=$(find src -name '*.js' | while read -r f; do [ -f "${f%.js}.ts" ] || echo "$f"; done)
          if [ -n "$orphans" ]; then
            echo "These .js files have no .ts source:"; echo "$orphans"; exit 1
          fi

      - name: Build PureScript
        run: npx spago build

      - name: Bundle examples
        run: npm run build:examples

      - name: Test
        run: npm test

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Smoke-test examples in Chromium
        run: npm run test:smoke

      - name: Bundle the benchmark
        run: npm run bench

      - name: Generated DOM modules are up to date
        run: |
          npm run codegen:dom
          git diff --exit-code -- 'src/**/*.g.purs'
          test -z "$(git status --porcelain -- 'src/**/*.g.purs')"
