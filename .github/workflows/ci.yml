name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Cache PureScript packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/spago-nodejs
            .spago
          key: spago-${{ hashFiles('spago.lock') }}

      - name: Install
        run: npm ci

      - name: Type-check TypeScript
        run: npx tsc

      - name: Build PureScript
        run: npx spago build

      - name: Bundle examples
        run: npm run build:examples

      - name: Test
        run: npm test

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Smoke-test examples in Chromium
        run: npm run test:smoke

      - name: Bundle the benchmark
        run: npm run bench

      - name: Generated DOM modules are up to date
        run: |
          npm run codegen:dom
          git diff --exit-code -- 'src/Screamer/DOM/*.g.purs'
          test -z "$(git status --porcelain -- 'src/Screamer/DOM/*.g.purs')"
